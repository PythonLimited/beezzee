# Multi-GPU training config for accelerate
# Usage: accelerate launch --config_file configs/accelerate_dgx.yaml scripts/train_mtc.py --config qwen3_5_08b_dgx

compute_environment: LOCAL_MACHINE
distributed_type: MULTI_GPU
num_processes: 8              # use all 8 A100s
mixed_precision: bf16
gpu_ids: all
main_process_port: 29500
